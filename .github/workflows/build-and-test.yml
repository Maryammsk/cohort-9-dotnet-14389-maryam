name: Build and Test .NET Solution

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install SonarScanner for .NET
      if: ${{ env.SONAR_TOKEN != '' }}
      shell: bash
      run: |
        dotnet tool install --global dotnet-sonarscanner
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Begin SonarCloud analysis
      if: ${{ env.SONAR_TOKEN != '' }}
      shell: bash
      env:
        SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      run: >-
        dotnet sonarscanner begin
        /k:"$SONAR_PROJECT_KEY"
        /o:"$SONAR_ORGANIZATION"
        /d:sonar.token="$SONAR_TOKEN"
        /d:sonar.host.url="https://sonarcloud.io"

    - name: Restore dependencies
      run: dotnet restore TaskManagementTool.slnx

    - name: Build solution
      run: dotnet build TaskManagementTool.slnx --configuration Release --no-restore

    - name: Run unit & integration tests
      run: dotnet test TaskManagementTool.slnx --configuration Release --no-build --verbosity normal

    - name: End SonarCloud analysis
      if: ${{ env.SONAR_TOKEN != '' }}
      shell: bash
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"