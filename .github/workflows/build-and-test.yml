name: Build and Test .NET Solution

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore TaskManagementTool.slnx

    - name: Build solution
      run: dotnet build TaskManagementTool.slnx --configuration Release --no-restore

    - name: Run unit & integration tests
      run: dotnet test TaskManagementTool.slnx --configuration Release --no-build --verbosity normal